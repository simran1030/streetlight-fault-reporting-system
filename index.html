<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Light Fault Reporting</title>
</head>
<body>
    <h1>Street Light Fault Reporting System</h1>
    <p>Report street light problems in your area.</p>

    <form>
        <label for="location">Location:</label>
        <input type="text" id="location" placeholder="Enter location" required>
        <br><br>

        <label for="issue">Fault Description:</label>
        <textarea id="issue" placeholder="Describe the problem" required></textarea>
        <br><br>

        <button type="submit">Report Fault</button>
    </form>
</body>
</html>
